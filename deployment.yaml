apiVersion: v1
kind: Namespace
metadata:
  name: <your-namespace> #-> Give your own namespace with your name Ex: ram-ns

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <your-app-name> #-> Give your deployment name Ex: test-app
  namespace: <your-namespace> 

spec:
  replicas: 2

  selector:
    matchLabels:
      app: <your-app-label> #-> Give your app name app: java-1

  template:
    metadata:
      labels:
        app: <your-app-label> 

    spec:
      containers:
        - name: <your-container-name> #-> Give your container name Ex: java-1-container

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: <container-port> #-> make sure you mention container port properly ex: 8000 or 3000 depends on the container running.

---
apiVersion: v1
kind: Service
metadata:
  name: <your-service-name> #-> Give your service name Ex: java-1-service
  namespace: <your-namespace>

spec:
  selector:
    app: <your-app-label>

  ports:
    - protocol: TCP
      port: 80 #-> keep the same port for service from pod port as well for best practice.
      targetPort: 80  #-> make sure you mention container port properly ex: 8000 or 3000 depends on the container running.

  type: LoadBalancer
